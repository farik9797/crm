<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Демо учёта склада</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: шапка с ролью и меню, под ней один рабочий экран; таблицы скроллятся внутри своих контейнеров */
:root{
  --bg:#f3f5f4; --paper:#ffffff; --fg:#1b2422; --muted:#5b6865; --line:#d7dedb;
  --accent:#0f6b5c; --on-accent:#ffffff; --accent-soft:#e1efeb; --tape:#e8a33d; --tape-soft:#fbefd9;
  --ok:#2f7d4f; --warn:#a35f00; --bad:#b3261e; --bad-soft:#fbe4e2; --chrome:#e9edeb;
  --f-display:"Manrope",system-ui,sans-serif; --f-body:"Onest",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --paper:#1a2220; --fg:#e4ebe8; --muted:#97a6a2; --line:#2d3a37;
  --accent:#5cc2ad; --on-accent:#0d1a17; --accent-soft:#1d3530; --tape:#f0b55a; --tape-soft:#3a2d17;
  --ok:#6fcf97; --warn:#f0b55a; --bad:#ff8a80; --bad-soft:#3d1f1d; --chrome:#222c29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --paper:#1a2220; --fg:#e4ebe8; --muted:#97a6a2; --line:#2d3a37;
  --accent:#5cc2ad; --on-accent:#0d1a17; --accent-soft:#1d3530; --tape:#f0b55a; --tape-soft:#3a2d17;
  --ok:#6fcf97; --warn:#f0b55a; --bad:#ff8a80; --bad-soft:#3d1f1d; --chrome:#222c29; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
.top{background:var(--chrome);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.logo{font:800 17px var(--f-display)}
.logo small{font:600 10px var(--f-mono);color:var(--warn);background:var(--tape-soft);padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;letter-spacing:.04em}
.roles{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);margin-left:auto}
.roles button{border:0;background:transparent;color:var(--fg);font:500 13px var(--f-body);padding:7px 12px;cursor:pointer}
.roles button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
nav.tabs{max-width:1100px;margin:8px auto 0;display:flex;flex-wrap:wrap;gap:4px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:500 14px var(--f-body);padding:6px 10px;border-radius:6px;cursor:pointer}
nav.tabs button.on{color:var(--fg);background:var(--paper);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.page{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:24px;font-weight:800} h2{font-size:18px;font-weight:800} h3{font-size:15px;font-weight:600}
p{margin:0;max-width:70ch}
.muted{color:var(--muted)} .small{font-size:13px}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi small{font-size:12px;color:var(--muted)}
.kpi b{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.split{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:4px}
.split i{display:block}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pill{display:inline-block;font:600 11px var(--f-mono);padding:3px 8px;border-radius:10px;white-space:nowrap}
.p-ok{background:var(--accent-soft);color:var(--ok)} .p-wait{background:var(--tape-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-n{background:var(--chrome);color:var(--muted)}
.btn{font:600 14px var(--f-body);padding:9px 14px;border-radius:7px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.link{background:transparent;border-color:transparent;color:var(--accent);padding:4px 6px}
.btn:hover{filter:brightness(1.08)}
button:focus-visible,input:focus-visible,select:focus-visible,label.file:focus-within{outline:2px solid var(--tape);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--muted)}
input,select{font:14px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input.q{width:100px;text-align:right;font-family:var(--f-mono)}
input.pr{width:120px;text-align:right;font-family:var(--f-mono)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--fg);font:500 13px var(--f-body);padding:8px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.err{color:var(--bad);font-size:13px}
.banner{max-width:1100px;margin:0 auto;font-size:13px;background:var(--tape-soft);border-left:3px solid var(--tape);padding:9px 12px;border-radius:0 6px 6px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.waybill{background:#ffffff;color:#1b1b1b;border:1px solid var(--line);border-radius:4px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:520px}
.waybill h3{text-align:center;font-size:16px;font-weight:800}
.waybill th{color:#555}.waybill td,.waybill th{border-bottom:1px solid #ccc}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px}
.sign div{border-top:1px solid #333;padding-top:4px;font-size:11px;color:#555}
.sign b{display:block;font-size:13px;color:#1b1b1b;margin-bottom:22px}
label.file{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
label.file input{position:absolute;opacity:0;width:1px;height:1px}
.scen{display:flex;flex-direction:column;gap:12px}
.scen .card{gap:8px}
.scen ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-family:var(--f-display);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.note{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.del{color:var(--bad)}
.user{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:14px}
.login{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.whocard{text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--fg);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit}
.whocard b{font-family:var(--f-display);font-size:16px}
.whocard span{font-size:13px;color:var(--muted)}
.whocard:hover{border-color:var(--accent)}
.whocard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
#login .f{max-width:320px}
@media (max-width:640px){.who{grid-template-columns:1fr}}
.copybox{width:100%;min-height:120px;font:12px var(--f-mono)}
@media (max-width:640px){.roles{margin-left:0;width:100%}.roles button{flex:1}}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

<header class="top">
  <div class="top-in">
    <span class="logo">Склад<small>ДЕМО</small></span>
    <div class="user" id="user"></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
</header>
<main><div class="page" id="app"></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
const ROLES={boss:'Руководитель',snab:'Снабженец',zav:'Завсклад'};
const TABS={
  home:{t:'Главная',r:['boss']},
  purchases:{t:'Закупки',r:['boss','snab']},
  receive:{t:'Приёмка',r:['zav']},
  issues:{t:'Выдача',r:['boss','zav']},
  stock:{t:'Остатки',r:['boss','snab','zav']},
  suppliers:{t:'Поставщики',r:['boss']},
  reports:{t:'Отчёты',r:['boss']}
};
// Демо-доступы: проверяются в браузере, защиты не дают
const USERS={
  boss:{login:'rahbar',pass:'1111',d:'Видит всё: цены, долги поставщикам, отчёты'},
  snab:{login:'snab',pass:'2222',d:'Вводит закупки и видит их цены'},
  zav:{login:'sklad',pass:'3333',d:'Приёмка и выдача подрядчикам, без цен'}
};
const PAY={debt:'В долг',cash:'Наличные',perech:'Перечисление'};
const KEY='sklad-demo-v1';

function seed(){
  const P=[
    ['KNAUF GIPSOKARTON STENAVOY','лист',60500],['KNAUF GIPSOKARTON AGNEUPORNIY','лист',76500],
    ['KNAUF MINVATA RULON 16,6','рулон',240000],['KNAUF ROTBAND 25','мешок',50000],
    ['DEMIR PROFIL 27*28 060','м',4300],['SOMAFIX KALBASA QORA 752','шт',65000],
    ['SOMAFIX PENA SE 600','шт',65000],['AKKERMAN SEMENT 575','мешок',37500],
    ['UDDA ZAJIM 1,5','шт',35000],['VENTUM 710','шт',39000],['PENA PLEX 5','лист',31500],
    ['MAPE FUGA 112 5','шт',185000],['ANKER BOLT 10*120','шт',2000],['AGRAF XITOY','шт',1000]
  ].map((p,i)=>({id:'p'+(i+1),name:p[0],unit:p[1],price:p[2]}));
  return {
    seq:{z:3,n:2,o:1},
    products:P,
    suppliers:[
      {id:'s1',name:'Поставщик стройматериалов',open:{uzs:150000000,usd:50},note:'пример'},
      {id:'s2',name:'Поставщик Б (пример)',open:{uzs:0,usd:0},note:''}
    ],
    contractors:[{id:'c1',name:'Подрядчик А (пример)'},{id:'c2',name:'Подрядчик Б (пример)'}],
    purchases:[
      {id:'z1',no:'З-0001',date:'2026-11-02',sid:'s1',inv:'87 901',cur:'uzs',pay:'debt',
       lines:[{pid:'p1',qty:100,price:60500},{pid:'p5',qty:4320,price:4300},{svc:'Доставка',qty:1,price:250000}],
       status:'diff',recv:{p1:100,p5:4300},recvDate:'2026-11-03'},
      {id:'z2',no:'З-0002',date:'2026-11-03',sid:'s1',inv:'87 955',cur:'uzs',pay:'cash',
       lines:[{pid:'p6',qty:200,price:65000},{pid:'p4',qty:100,price:50000}],
       status:'done',recv:{p6:200,p4:100},recvDate:'2026-11-03'},
      {id:'z3',no:'З-0003',date:'2026-11-05',sid:'s1',inv:'88 120',cur:'uzs',pay:'perech',
       lines:[{pid:'p3',qty:30,price:240000},{pid:'p2',qty:50,price:76500},{svc:'Доставка',qty:1,price:120000}],
       status:'transit',recv:{},recvDate:null}
    ],
    issues:[
      {id:'n1',no:'Н-0001',date:'2026-11-04',cid:'c1',who:'Каримов А. (пример)',lines:[{pid:'p1',qty:40},{pid:'p5',qty:1200}],photo:'nakladnaya-0001.jpg'},
      {id:'n2',no:'Н-0002',date:'2026-11-05',cid:'c2',who:'Юсупов Б. (пример)',lines:[{pid:'p6',qty:150}],photo:''}
    ],
    payments:[{id:'o1',date:'2026-11-04',sid:'s1',amount:20000000,cur:'uzs',method:'perech',type:'pay'}],
    returns:[],
    log:[
      {d:'2026-11-05',r:'snab',t:'Закупка З-0003 отправлена на склад'},
      {d:'2026-11-05',r:'zav',t:'Выдача Н-0002 → Подрядчик Б (пример), ждёт фото подписи'},
      {d:'2026-11-04',r:'boss',t:'Оплата поставщику 20 000 000 сум, перечисление'},
      {d:'2026-11-04',r:'zav',t:'Выдача Н-0001 → Подрядчик А (пример)'},
      {d:'2026-11-03',r:'zav',t:'Приёмка З-0001: расхождение по DEMIR PROFIL (−20 м)'},
      {d:'2026-11-03',r:'zav',t:'Приёмка З-0002 без расхождений'}
    ],
    checks:{}
  };
}
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
let role=null,tab='home',view=null,draft=null,msg='',loginPick=null,loginErr='';
try{const r=localStorage.getItem(KEY+'-role');if(r&&ROLES[r])role=r}catch(e){}
{const h=location.hash.slice(1);if(USERS[h])loginPick=h}
const firstTab=r=>Object.keys(TABS).find(k=>TABS[k].r.includes(r));

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('ru-RU',{maximumFractionDigits:2});
const money=(n,cur)=>fmt(n)+(cur==='usd'?' $':'');
const dd=d=>d?d.slice(8,10)+'.'+d.slice(5,7):'';
const today=()=>new Date().toISOString().slice(0,10);
const prod=id=>S.products.find(p=>p.id===id);
const sup=id=>S.suppliers.find(s=>s.id===id);
const con=id=>S.contractors.find(c=>c.id===id);
const prices=()=>role!=='zav';
const lineName=l=>l.svc?l.svc:(prod(l.pid)||{}).name;
const lineSum=ls=>ls.reduce((a,l)=>a+l.qty*l.price,0);
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function addLog(t){S.log.unshift({d:today(),r:role,t})}

/* ---------- расчёты ---------- */
function stockOf(pid){
  let ordered=0,recv=0,iss=0,ret=0;
  S.purchases.forEach(z=>{z.lines.forEach(l=>{if(l.pid===pid)ordered+=l.qty});recv+=(z.recv[pid]||0)});
  S.issues.forEach(n=>n.lines.forEach(l=>{if(l.pid===pid)iss+=l.qty}));
  S.returns.forEach(v=>v.lines.forEach(l=>{if(l.pid===pid)ret+=l.qty}));
  return {ordered,recv,iss,ret,left:recv-iss-ret};
}
function avgPrice(pid){
  let q=0,s=0;S.purchases.forEach(z=>{if(z.cur!=='uzs')return;z.lines.forEach(l=>{if(l.pid===pid){q+=l.qty;s+=l.qty*l.price}})});
  return q?s/q:(prod(pid)||{}).price||0;
}
function supOps(sid){
  const ops=[];
  S.purchases.filter(z=>z.sid===sid).forEach(z=>{
    const sum=lineSum(z.lines);
    ops.push({d:z.date,t:'Закупка '+z.no+(z.inv?', накл. '+z.inv:''),cur:z.cur,plus:sum,pill:z.pay});
    if(z.pay!=='debt')ops.push({d:z.date,t:'Оплата при закупке '+z.no,cur:z.cur,minus:sum,pill:z.pay});
  });
  S.payments.filter(o=>o.sid===sid).forEach(o=>ops.push({d:o.date,t:o.type==='discount'?'Скидка':'Оплата',cur:o.cur,minus:o.amount,pill:o.type==='discount'?'disc':o.method}));
  S.returns.filter(v=>v.sid===sid).forEach(v=>ops.push({d:v.date,t:'Возврат товара',cur:'uzs',minus:lineSum(v.lines),pill:'ret'}));
  return ops.sort((a,b)=>a.d.localeCompare(b.d));
}
function debt(sid){
  const s=sup(sid),r={uzs:s.open.uzs,usd:s.open.usd};
  supOps(sid).forEach(o=>{r[o.cur]+=(o.plus||0)-(o.minus||0)});return r;
}

/* ---------- каркас ---------- */
function renderChrome(){
  $('#user').innerHTML=role?`<span class="muted">${ROLES[role]} · ${USERS[role].login}</span><button class="btn link sm" data-act="logout">Выйти</button>`:'';
  $('#tabs').hidden=!role;
  if(!role)return;
  $('#tabs').innerHTML=Object.entries(TABS).filter(([k,v])=>v.r.includes(role)).map(([k,v])=>`<button class="${k===tab?'on':''}" data-tab="${k}">${v.t}</button>`).join('');
}
function render(){
  renderChrome();
  const f=role?{home,purchases,receive,issues,stock,suppliers,reports}[tab]:login;
  $('#app').innerHTML=`<div class="banner"><span>Демо для теста. Все данные — примеры. Всё, что вы введёте, хранится только в этом браузере.</span><button class="btn link sm" data-act="reset">Сбросить демо</button></div>`+f();
  save();
}
function go(t,v){tab=t;view=v||null;draft=null;window.scrollTo(0,0);render()}

/* ---------- Главная ---------- */
function home(){
  let bought=0,by={debt:0,cash:0,perech:0},recvV=0,issV=0;
  S.purchases.filter(z=>z.cur==='uzs').forEach(z=>{const s=lineSum(z.lines);bought+=s;by[z.pay]+=s});
  S.products.forEach(p=>{const st=stockOf(p.id),a=avgPrice(p.id);recvV+=st.recv*a;issV+=st.iss*a});
  let leftV=0;S.products.forEach(p=>{leftV+=stockOf(p.id).left*avgPrice(p.id)});
  let d={uzs:0,usd:0};S.suppliers.forEach(s=>{const x=debt(s.id);d.uzs+=x.uzs;d.usd+=x.usd});
  const pc=k=>bought?(by[k]/bought*100):0;
  const transit=S.purchases.filter(z=>z.status==='transit').length, diffs=S.purchases.filter(z=>z.status==='diff').length, unsigned=S.issues.filter(n=>!n.photo).length;
  return `<div class="head"><h1>Сводка</h1><span class="muted small">с начала учёта в демо</span></div>
  <div class="kpis">
    <div class="kpi"><small>Закуплено</small><b>${fmt(bought)}</b>
      <div class="split"><i style="width:${pc('perech')}%;background:var(--accent)"></i><i style="width:${pc('cash')}%;background:var(--tape)"></i><i style="width:${pc('debt')}%;background:var(--bad)"></i></div>
      <small>перечисл. ${fmt(by.perech)} · нал ${fmt(by.cash)} · в долг ${fmt(by.debt)}</small></div>
    <div class="kpi"><small>Принято складом</small><b>${fmt(recvV)}</b><small>${transit} в пути · ${diffs} с расхождением</small></div>
    <div class="kpi"><small>Выдано подрядчикам</small><b>${fmt(issV)}</b><small>${S.issues.length} накладных · ${unsigned} без фото подписи</small></div>
    <div class="kpi"><small>Остаток на складе</small><b>${fmt(leftV)}</b><small>по средней цене закупки</small></div>
    <div class="kpi"><small>Долг поставщикам</small><b style="color:var(--warn)">${fmt(d.uzs)}</b><small>+ ${fmt(d.usd)} $</small></div>
  </div>

/* ---------- Закупки ---------- */

function payPill(p){return p==='debt'?'<span class="pill p-bad">в долг</span>':p==='cash'?'<span class="pill p-wait">наличные</span>':p==='perech'?'<span class="pill p-ok">перечисление</span>':p==='disc'?'<span class="pill p-n">скидка</span>':p==='ret'?'<span class="pill p-n">возврат</span>':''}

}

  ${z.recvDate?`<p class="note">Принято завскладом ${dd(z.recvDate)}.</p>`:'<p class="note">Ждёт приёмки на складе. Переключитесь на роль «Завсклад» → «Приёмка».</p>'}</div>`;

function draftTotal(){return draft.lines.reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0)}
function submitPurchase(){

  const no='З-'+String(++S.seq.z).padStart(4,'0');

/* ---------- Приёмка ---------- */
function receive(){

  ${list.map(z=>`<tr class="click" data-recv="${z.id}"><td>${z.no}</td><td>${dd(z.date)}</td><td>${esc(sup(z.sid).name)}</td><td class="num">${z.lines.filter(l=>l.pid).length}</td><td><button class="btn sm" data-recv="${z.id}">Принять</button></td></tr>`).join('')}

function receiveForm(id){
  const z=S.purchases.find(x=>x.id===id);
  return `<div class="head"><div><button class="btn link sm" data-back="receive">← Приёмка</button><h1>Приёмка ${z.no}</h1></div></div>
  <form class="card" id="rform" data-id="${z.id}" novalidate>
    <p class="muted small">Впишите, сколько пришло по факту. Если меньше или больше — руководитель увидит расхождение.</p>
    <div class="scroll"><table><thead><tr><th>Товар</th><th>Ед.</th><th class="num">Отправлено</th><th class="num">Пришло</th></tr></thead><tbody>
    ${z.lines.filter(l=>l.pid).map((l,i)=>`<tr><td>${esc(prod(l.pid).name)}</td><td>${prod(l.pid).unit}</td><td class="num">${fmt(l.qty)}</td><td class="num"><input id="rf-${i}" class="q" inputmode="decimal" value="${l.qty}" data-pid="${l.pid}" aria-label="Пришло: ${esc(prod(l.pid).name)}"></td></tr>`).join('')}
    </tbody></table></div>
    <div class="f"><label for="rf-comment">Комментарий (необязательно)</label><input id="rf-comment" placeholder="например: 20 м профиля погнуты, не приняли"></div>
    <div><button type="submit" class="btn">Принять на склад</button></div>
  </form>`;
}
function submitReceive(form){
  const z=S.purchases.find(x=>x.id===form.dataset.id);const recv={};let diff=[];let bad=false;
  form.querySelectorAll('input[data-pid]').forEach(inp=>{const v=+String(inp.value).replace(',','.');if(!(v>=0)||inp.value==='')bad=true;recv[inp.dataset.pid]=v});
  if(bad){toast('Укажите количество по каждой строке (0, если не пришло)');return}
  z.lines.forEach(l=>{if(l.pid&&recv[l.pid]!==l.qty)diff.push(prod(l.pid).name+' ('+(recv[l.pid]-l.qty>0?'+':'')+fmt(recv[l.pid]-l.qty)+' '+prod(l.pid).unit+')')});
  z.recv=recv;z.recvDate=today();z.status=diff.length?'diff':'done';
  const c=$('#rf-comment').value.trim();
  addLog('Приёмка '+z.no+(diff.length?': расхождение — '+diff.join(', '):' без расхождений')+(c?'. '+c:''));
  toast(diff.length?'Принято с расхождением, руководитель увидит':'Принято без расхождений');go('receive');
}

function submitIssue(){
  const ls=draft.lines.filter(l=>l.pid);
  if(!draft.who.trim()){draft.err='Впишите ФИО того, кто получает материал.';return render()}
  if(!ls.length){draft.err='Добавьте хотя бы один товар.';return render()}
  for(const l of ls){const left=stockOf(l.pid).left,q=+String(l.qty).replace(',','.');
    if(!(q>0)){draft.err='Укажите количество для «'+prod(l.pid).name+'».';return render()}
    if(q>left){draft.err='«'+prod(l.pid).name+'»: на складе только '+fmt(left)+' '+prod(l.pid).unit+'. Выдать больше остатка нельзя.';return render()}}
  const no='Н-'+String(++S.seq.n).padStart(4,'0');
  const n={id:'n'+Date.now(),no,date:today(),cid:draft.cid,who:draft.who.trim(),lines:ls.map(l=>({pid:l.pid,qty:+String(l.qty).replace(',','.')})),photo:''};
  S.issues.push(n);addLog('Выдача '+no+' → '+con(n.cid).name+', получил '+n.who);
  toast('Накладная '+no+' оформлена');go('issues',n.id);
}

/* ---------- Остатки ---------- */
function stock(){
  const pr=prices();
  if(view)return productView(view);
  const rows=S.products.map(p=>({p,s:stockOf(p.id),a:avgPrice(p.id)})).filter(x=>x.s.ordered||x.s.recv);
  let total=0;rows.forEach(x=>total+=x.s.left*x.a);
  return `<div class="head"><h1>Остатки</h1><div class="row">${pr?`<span class="num"><b>Всего: ${fmt(total)} сум</b></span>`:''}${expBtns('stock')}</div></div>${copyBox()}
  <div class="card"><div class="scroll"><table><thead><tr><th>Товар</th><th>Ед.</th>${pr?'<th class="num">Закуплено</th>':''}<th class="num">Принято</th><th class="num">Выдано</th><th class="num">Возврат</th><th class="num">Остаток</th>${pr?'<th class="num">Ср. цена</th><th class="num">Остаток, сум</th>':''}</tr></thead><tbody>
  ${rows.map(({p,s,a})=>`<tr class="click" data-prod="${p.id}"><td>${esc(p.name)}</td><td>${p.unit}</td>${pr?`<td class="num">${fmt(s.ordered)}</td>`:''}<td class="num" style="${s.recv<s.ordered&&pr?'color:var(--bad)':''}">${fmt(s.recv)}</td><td class="num">${fmt(s.iss)}</td><td class="num">${fmt(s.ret)}</td><td class="num"><b>${fmt(s.left)}</b></td>${pr?`<td class="num">${fmt(Math.round(a))}</td><td class="num">${fmt(Math.round(s.left*a))}</td>`:''}</tr>`).join('')}
  </tbody></table></div>
  ${pr?'':'<p class="note">Роль «Завсклад»: цен и сумм нет. В рабочей программе сервер их вообще не отдаёт этой роли.</p>'}</div>`;
}
function productView(pid){
  const p=prod(pid),pr=prices(),ev=[];
  S.purchases.forEach(z=>z.lines.forEach(l=>{if(l.pid===pid){ev.push({d:z.date,t:'Закупка '+z.no,q:'+'+fmt(l.qty)+' заказано',price:l.price});if(z.status!=='transit')ev.push({d:z.recvDate,t:'Приёмка '+z.no,q:'+'+fmt(z.recv[pid]||0)})}}));
  S.issues.forEach(n=>n.lines.forEach(l=>{if(l.pid===pid)ev.push({d:n.date,t:'Выдача '+n.no+' → '+con(n.cid).name,q:'−'+fmt(l.qty)})}));
  S.returns.forEach(v=>v.lines.forEach(l=>{if(l.pid===pid)ev.push({d:v.date,t:'Возврат поставщику',q:'−'+fmt(l.qty)})}));
  ev.sort((a,b)=>a.d.localeCompare(b.d));
  return `<div class="head"><div><button class="btn link sm" data-back="stock">← Остатки</button><h1>${esc(p.name)}</h1></div><b class="num">Остаток: ${fmt(stockOf(pid).left)} ${p.unit}</b></div>
  <div class="card"><div class="scroll"><table><thead><tr><th>Дата</th><th>Документ</th><th class="num">Кол-во</th>${pr?'<th class="num">Цена</th>':''}</tr></thead><tbody>
  ${ev.map(e=>`<tr><td>${dd(e.d)}</td><td>${esc(e.t)}</td><td class="num">${e.q}</td>${pr?`<td class="num">${e.price?fmt(e.price):''}</td>`:''}</tr>`).join('')}
  </tbody></table></div></div>`;
}

/* ---------- Поставщики ---------- */
function suppliers(){

/* ---------- экспорт в Excel ---------- */
// В окне артефакта браузер блокирует скачивание файлов, поэтому там вместо файла копируем таблицу в буфер
const canDownload=location.protocol==='file:'||/(^|\.)github\.io$/.test(location.hostname)||location.hostname==='localhost';
let copied=null;
function expBtns(kind){return canDownload?`<button class="btn ghost sm" data-exp="${kind}">Скачать Excel</button>`:`<button class="btn ghost sm" data-copy="${kind}">Скопировать для Excel</button>`}
function copyBox(){return copied?`<div class="card"><p class="small">Выделите текст и скопируйте (Ctrl+C), затем вставьте в Excel. Файл .xlsx скачивается в версии на farik9797.github.io/crm/demo.html</p><textarea class="copybox" id="copybox" readonly>${esc(copied)}</textarea></div>`:''}
const dfull=d=>d?d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4):'';
const r2=n=>Math.round(n*100)/100;
function sheet(kind){
  const pr=prices(),[k,arg]=kind.split(':');
  if(k==='purchases'){
    const rows=[['№','Дата','Поставщик','№ накладной поставщика','Оплата','Валюта','Товар','Ед.','Заказано','Принято','Цена','Сумма','Статус']];
    S.purchases.forEach(z=>z.lines.forEach(l=>{const p=l.pid&&prod(l.pid);
      rows.push([z.no,dfull(z.date),sup(z.sid).name,z.inv,PAY[z.pay],z.cur==='usd'?'$':'сум',lineName(l),p?p.unit:'рейс',l.qty,l.pid?(z.status==='transit'?'':(z.recv[l.pid]??0)):'',l.price,r2(l.qty*l.price),{transit:'в пути',diff:'расхождение',done:'принято'}[z.status]])}));
    return {title:'Закупки',file:'zakupki',rows};
  }
  if(k==='stock'){
    const h=['Товар','Ед.'];if(pr)h.push('Закуплено');h.push('Принято','Выдано','Возврат','Остаток');if(pr)h.push('Ср. цена','Остаток, сум');
    const rows=[h];
    S.products.forEach(p=>{const s=stockOf(p.id),a=avgPrice(p.id);if(!s.ordered&&!s.recv)return;
      const r=[p.name,p.unit];if(pr)r.push(s.ordered);r.push(s.recv,s.iss,s.ret,s.left);if(pr)r.push(Math.round(a),Math.round(s.left*a));rows.push(r)});
    return {title:'Остатки на '+dfull(today()),file:'ostatki',rows};
  }
  if(k==='issues'){
    const h=['№','Дата','Подрядчик','Получил','Товар','Ед.','Кол-во'];if(pr)h.push('Сумма по ср. цене');h.push('Фото подписи');
    const rows=[h];
    S.issues.forEach(n=>n.lines.forEach(l=>{const p=prod(l.pid),r=[n.no,dfull(n.date),con(n.cid).name,n.who,p.name,p.unit,l.qty];if(pr)r.push(Math.round(l.qty*avgPrice(l.pid)));r.push(n.photo?'есть':'нет');rows.push(r)}));
    return {title:'Выдачи подрядчикам',file:'vydachi',rows};
  }
  if(k==='waybill'){
    const n=S.issues.find(x=>x.id===arg),rows=[['№','Наименование','Ед.','Кол-во']];
    n.lines.forEach((l,i)=>rows.push([i+1,prod(l.pid).name,prod(l.pid).unit,l.qty]));
    rows.push([],['Получатель',con(n.cid).name],['Отпустил (завсклад)','ФИО, подпись'],['Получил',n.who+', подпись']);
    return {title:'Накладная на выдачу № '+n.no+' от '+dfull(n.date),file:'nakladnaya-'+n.no,rows};
  }
  if(k==='akt'){
    const s=sup(arg),run={uzs:s.open.uzs,usd:s.open.usd};
    const rows=[['Дата','Операция','Способ','Валюта','Долг +','Долг −','Сальдо, сум','Сальдо, $'],['','Сальдо на начало','','','','',r2(run.uzs),r2(run.usd)]];
    const lbl={debt:'в долг',cash:'наличные',perech:'перечисление',disc:'скидка',ret:'возврат'};
    supOps(arg).forEach(o=>{run[o.cur]+=(o.plus||0)-(o.minus||0);rows.push([dfull(o.d),o.t,lbl[o.pill]||'',o.cur==='usd'?'$':'сум',o.plus?r2(o.plus):'',o.minus?r2(o.minus):'',r2(run.uzs),r2(run.usd)])});
    rows.push(['','Сальдо на '+dfull(today()),'','','','',r2(run.uzs),r2(run.usd)]);
    return {title:'Акт сверки: '+s.name,file:'akt-sverki',rows};
  }
  if(k==='day'){
    const rows=[['Раздел','Документ','Товар','Ед.','Кол-во','Сумма','Оплата']];
    S.purchases.filter(z=>z.date===arg).forEach(z=>z.lines.forEach(l=>{const p=l.pid&&prod(l.pid);rows.push(['Отправлено на склад',z.no,lineName(l),p?p.unit:'рейс',l.qty,r2(l.qty*l.price),PAY[z.pay]])}));
    S.purchases.filter(z=>z.recvDate===arg).forEach(z=>z.lines.filter(l=>l.pid).forEach(l=>rows.push(['Принято складом',z.no,prod(l.pid).name,prod(l.pid).unit,z.recv[l.pid]??0,'',''])));
    S.issues.filter(n=>n.date===arg).forEach(n=>n.lines.forEach(l=>rows.push(['Выдано: '+con(n.cid).name,n.no,prod(l.pid).name,prod(l.pid).unit,l.qty,'',''])));
    return {title:'Отчёт за '+dfull(arg),file:'otchet-'+arg,rows};
  }
}
function download(kind){
  if(typeof XLSX==='undefined'){toast('Не загрузилась библиотека Excel. Проверьте интернет и обновите страницу.');return}
  const d=sheet(kind),aoa=[[d.title],['Выгружено '+dfull(today())+', роль: '+ROLES[role]],[]].concat(d.rows);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=d.rows[0].map((_,c)=>({wch:Math.min(45,Math.max(8,...d.rows.map(r=>String(r[c]??'').length+2)))}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Лист1');
  XLSX.writeFile(wb,d.file+'.xlsx');toast('Файл '+d.file+'.xlsx скачан');
}
function copyTsv(kind){
  const d=sheet(kind);
  copied=[d.title].concat(d.rows.map(r=>r.map(v=>typeof v==='number'?String(v).replace('.',','):String(v??'').replace(/[\t\n]/g,' ')).join('\t'))).join('\n');
  const done=()=>toast('Таблица скопирована. Вставьте в Excel (Ctrl+V)');
  try{navigator.clipboard.writeText(copied).then(()=>{copied=null;render();done()},()=>{render();const t=$('#copybox');if(t){t.focus();t.select()}})}catch(e){render();const t=$('#copybox');if(t){t.focus();t.select()}}
}

    return render();
  }
  if(t.dataset.d==='sid'&&draft){draft.sid=t.value}
  if(t.id==='sup-sel'){view={sid:t.value};return render()}
  if(t.id==='rep-day'){view={day:t.value||today()};return render()}
  if(t.id==='ret-p'){const p=$('#ret-pr');if(p)p.value=Math.round(avgPrice(t.value))}
  if(t.dataset.check){S.checks[t.dataset.check]=t.checked;return render()}
  if(t.dataset.photo&&t.files&&t.files[0]){const n=S.issues.find(x=>x.id===t.dataset.photo);n.photo=t.files[0].name;addLog('Накладная '+n.no+': прикреплено фото подписи');toast('Фото подписи прикреплено');return render()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='login')return doLogin();
  if(f.id==='pform')return submitPurchase();
  if(f.id==='rform')return submitReceive(f);
  if(f.id==='iform')return submitIssue();
  if(f.id==='payform'){
    const amt=+$('#pay-amount').value.replace(/\s/g,'').replace(',','.');
    if(!(amt>0)){$('#pay-err').textContent='Впишите сумму больше нуля.';return}
    const o={id:'o'+Date.now(),date:$('#pay-date').value||today(),sid:f.dataset.sid,amount:amt,cur:$('#pay-cur').value,method:$('#pay-method').value,type:$('#pay-type').value};
    S.payments.push(o);addLog((o.type==='discount'?'Скидка':'Оплата')+' поставщику '+money(amt,o.cur)+(o.type==='pay'?', '+PAY[o.method].toLowerCase():''));
    toast('Проведено');view={sid:f.dataset.sid};return render();
  }
  if(f.id==='retform'){
    const pid=$('#ret-p').value,q=+$('#ret-q').value.replace(',','.'),pr=+$('#ret-pr').value.replace(/\s/g,'').replace(',','.');
    if(!pid){$('#ret-err').textContent='На складе нет товара для возврата.';return}
    const left=stockOf(pid).left;
    if(!(q>0)||q>left){$('#ret-err').textContent='Количество должно быть больше нуля и не больше остатка ('+fmt(left)+').';return}
    if(!(pr>0)){$('#ret-err').textContent='Укажите цену возврата.';return}
    S.returns.push({id:'v'+Date.now(),date:today(),sid:f.dataset.sid,lines:[{pid,qty:q,price:pr}]});
    addLog('Возврат поставщику: '+prod(pid).name+', '+fmt(q)+' '+prod(pid).unit);toast('Возврат проведён');view={sid:f.dataset.sid};return render();
  }
});
if(role&&!TABS[tab].r.includes(role))tab=firstTab(role);
render();
})();
</script>
